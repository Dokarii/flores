<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Isabel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Caveat', cursive;
            background-color: #fffcf2; 
        }

        /* Animación Uzumaki (Vórtice) */
        @keyframes uzumaki {
            0% { 
                transform: scale(0) rotate(-1080deg); 
                opacity: 0; 
                filter: blur(10px);
            }
            60% { 
                opacity: 1; 
            }
            100% { 
                transform: scale(1) rotate(0deg); 
                opacity: 1; 
                filter: blur(0px);
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .animacion-vortice {
            opacity: 0;
            /* Usamos una curva de aceleración para que empiece rápido y frene suavemente */
            animation: uzumaki 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .text-animate {
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1.5s forwards;
        }

        .btn-dibujado {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            border: 3px solid #854d0e;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center overflow-hidden relative">

    <button id="btnFlores" class="bg-yellow-300 hover:bg-yellow-400 text-yellow-900 text-4xl py-5 px-12 shadow-lg transition-transform transform hover:scale-105 btn-dibujado z-10">
        Para ti, Isabel ✨
    </button>

    <div id="escena" class="hidden absolute inset-0 flex flex-col items-center justify-center z-20 py-6">
        
        <!-- Texto superior -->
        <div class="text-center z-40 px-4 text-animate drop-shadow-sm mb-4">
            <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold text-yellow-800 leading-tight">
                Feliz día de las flores amarillas
            </h1>
            <h2 class="text-6xl md:text-7xl lg:text-8xl font-bold text-yellow-600 mt-2">
                muchacha Isabel 🌻
            </h2>
        </div>

        <!-- Imagen del Ramo con animación Uzumaki -->
        <div class="relative w-full max-w-md md:max-w-xl flex items-center justify-center px-4">
            <!-- La imagen se copia localmente como ramo.png -->
            <img src="ramo.png" alt="Ramo de flores amarillas" class="w-full h-auto animacion-vortice drop-shadow-2xl">
        </div>

    </div>

    <script>
        document.getElementById('btnFlores').addEventListener('click', function() {
            this.classList.add('hidden');
            const escena = document.getElementById('escena');
            escena.classList.remove('hidden');
            escena.classList.add('flex');
        });
    </script>
</body>
</html>
